name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.13.0

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: node scripts/version.mjs check
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test -tags webkit2_41 -count=1 ./...

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: windows/amd64
            tags: ""
          - label: macOS universal
            os: macos-latest
            target: darwin/universal
            tags: ""
          - label: Linux x64
            os: ubuntu-24.04
            target: linux/amd64
            tags: webkit2_41

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: web
      - name: Run Go tests
        if: matrix.tags == ''
        run: go test -count=1 ./...
      - name: Run Go tests with Linux WebKit tag
        if: matrix.tags != ''
        run: go test -tags "${{ matrix.tags }}" -count=1 ./...
      - name: Build desktop application
        shell: bash
        run: >-
          node scripts/wails-build.mjs
          -clean
          -platform "${{ matrix.target }}"
          ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }}
