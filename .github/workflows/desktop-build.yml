name: Desktop builds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 0.1.0
  WAILS_VERSION: v2.13.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows/amd64
            artifact: windows-amd64
            tags: ""
          - name: macOS universal
            os: macos-latest
            target: darwin/universal
            artifact: macos-universal
            tags: ""
          - name: Linux x64
            os: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
            tags: webkit2_41

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The root Go package embeds web/dist, which is intentionally not tracked.
      # Build it before any Go command compiles that package on a fresh runner.
      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run Go tests
        if: matrix.tags == ''
        run: go test ./...

      - name: Run Go tests with Linux WebKit tag
        if: matrix.tags != ''
        run: go test -tags "${{ matrix.tags }}" ./...

      - name: Build desktop application
        if: matrix.tags == ''
        shell: bash
        run: >-
          wails build
          -clean
          -platform "${{ matrix.target }}"
          -ldflags "-X main.version=${APP_VERSION}"

      - name: Build Linux desktop application
        if: matrix.tags != ''
        shell: bash
        run: >-
          wails build
          -clean
          -platform "${{ matrix.target }}"
          -tags "${{ matrix.tags }}"
          -ldflags "-X main.version=${APP_VERSION}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path build/bin/*
          -DestinationPath "build/NyaMediaMetadataTool-${{ matrix.artifact }}.zip"

      - name: Package macOS or Linux artifact
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          tar
          -czf "$GITHUB_WORKSPACE/build/NyaMediaMetadataTool-${{ matrix.artifact }}.tar.gz"
          -C build/bin
          .

      - name: Upload unsigned desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyaMediaMetadataTool-${{ matrix.artifact }}
          path: build/NyaMediaMetadataTool-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 14
