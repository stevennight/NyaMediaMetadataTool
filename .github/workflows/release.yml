name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.13.0

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      build_date: ${{ steps.version.outputs.build_date }}

    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "${GITHUB_REF_NAME}" != "v${version}" || ! "${version}" =~ ${semver} ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH format; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "${version}"
          if (( major > 255 || minor > 255 || patch > 65535 )); then
            echo "Release tag ${GITHUB_REF_NAME} exceeds Windows version limits." >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify release source
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: node scripts/version.mjs check "${{ needs.metadata.outputs.version }}"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test -tags webkit2_41 -count=1 ./...

  build:
    name: Build ${{ matrix.label }} installers
    needs: [metadata, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
          - label: macOS
            os: macos-latest
          - label: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential curl libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) { throw 'makensis.exe was not installed.' }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
        working-directory: web
      - name: Build web assets
        run: npm run build
        working-directory: web
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          NYAMEDIA_VERSION: ${{ needs.metadata.outputs.version }}
          NYAMEDIA_COMMIT: ${{ github.sha }}
          NYAMEDIA_BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          NYAMEDIA_UPDATE_REPOSITORY: ${{ github.repository }}
        run: node scripts/wails-build.mjs -clean -platform windows/amd64 -nsis -installscope user
      - name: Build macOS application
        if: runner.os == 'macOS'
        env:
          NYAMEDIA_VERSION: ${{ needs.metadata.outputs.version }}
          NYAMEDIA_COMMIT: ${{ github.sha }}
          NYAMEDIA_BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          NYAMEDIA_UPDATE_REPOSITORY: ${{ github.repository }}
        run: node scripts/wails-build.mjs -clean -platform darwin/universal
      - name: Build Linux application
        if: runner.os == 'Linux'
        env:
          NYAMEDIA_VERSION: ${{ needs.metadata.outputs.version }}
          NYAMEDIA_COMMIT: ${{ github.sha }}
          NYAMEDIA_BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          NYAMEDIA_UPDATE_REPOSITORY: ${{ github.repository }}
        run: node scripts/wails-build.mjs -clean -platform linux/amd64 -tags webkit2_41
      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $source = Get-ChildItem build/bin -File -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $source) { throw "No NSIS installer was produced." }
          Copy-Item $source.FullName "release-artifacts/NyaMediaMetadataTool-${{ needs.metadata.outputs.version }}-windows-amd64-installer.exe"
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-artifacts dmg-root
          app="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "${app}" || { echo "No macOS app bundle was produced." >&2; exit 1; }
          cp -R "${app}" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname NyaMediaMetadataTool -srcfolder dmg-root -ov -format UDZO \
            "release-artifacts/NyaMediaMetadataTool-${{ needs.metadata.outputs.version }}-macos-universal.dmg"
      - name: Create Linux DEB and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${{ needs.metadata.outputs.version }}"
          binary="build/bin/NyaMediaMetadataTool"
          test -x "${binary}" || { echo "No Linux binary was produced." >&2; exit 1; }
          mkdir -p release-artifacts package/DEBIAN package/usr/bin package/usr/share/applications package/usr/share/icons/hicolor/512x512/apps
          install -m 0755 "${binary}" package/usr/bin/NyaMediaMetadataTool
          install -m 0644 build/linux/nya-media-metadata-tool.desktop package/usr/share/applications/nya-media-metadata-tool.desktop
          install -m 0644 build/appicon.png package/usr/share/icons/hicolor/512x512/apps/nya-media-metadata-tool.png
          printf '%s\n' \
            'Package: nyamediametadatatool' \
            "Version: ${version}" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: NyaMediaMetadataTool Contributors' \
            'Depends: libgtk-3-0, libwebkit2gtk-4.1-0' \
            'Description: Local media metadata and companion-file workstation.' \
            > package/DEBIAN/control
          dpkg-deb --build --root-owner-group package "release-artifacts/NyaMediaMetadataTool-${version}-linux-amd64.deb"

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          install -m 0755 "${binary}" AppDir/usr/bin/NyaMediaMetadataTool
          install -m 0644 build/linux/nya-media-metadata-tool.desktop AppDir/nya-media-metadata-tool.desktop
          install -m 0644 build/linux/nya-media-metadata-tool.desktop AppDir/usr/share/applications/nya-media-metadata-tool.desktop
          install -m 0644 build/appicon.png AppDir/nya-media-metadata-tool.png
          install -m 0644 build/appicon.png AppDir/usr/share/icons/hicolor/512x512/apps/nya-media-metadata-tool.png
          ln -s usr/bin/NyaMediaMetadataTool AppDir/AppRun
          curl --fail --location --retry 3 \
            --output appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            "release-artifacts/NyaMediaMetadataTool-${version}-linux-amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: NyaMediaMetadataTool-${{ matrix.label }}-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NyaMediaMetadataTool-*
          path: downloaded-artifacts
      - name: Assemble release files and checksums
        shell: bash
        run: |
          mkdir release-files
          while IFS= read -r -d '' source; do
            filename="$(basename "${source}")"
            test ! -e "release-files/${filename}" || { echo "Duplicate release asset: ${filename}" >&2; exit 1; }
            cp "${source}" "release-files/${filename}"
          done < <(find downloaded-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)" || { echo "No release files were downloaded." >&2; exit 1; }
          (
            cd release-files
            sha256sum * > SHA256SUMS
          )
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NyaMediaMetadataTool v${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
