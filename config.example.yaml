server:
  addr: 127.0.0.1:18880
  timezone: Asia/Shanghai

database:
  path: data/nyamedia.db

tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  mkvextract: mkvextract
  mediainfo: mediainfo

processing:
  extensions:
    - .mkv
    - .mp4
    - .ts
    - .m2ts
    - .mts
    - .mov
    - .m4v
    - .avi
    - .wmv
    - .flv
    - .webm
    - .rmvb
    - .rm
    - .mpg
    - .mpeg
    - .vob
    - .asf
  concurrency: 2
  stableDelay: 30s
  stableChecks: 2
  bifWidth: 320
  bifInterval: 10
  bifHwAccel: cpu
  strategy: missing
  enableSubtitles: true
  enableMediaInfo: true
  enableNfo: true
  enableBif: true
  enableImageTakeover: false

upload:
  # Upload remains disabled until at least one destination is configured in the Web UI.
  enabled: false
  concurrency: 1
  # Coalesce completed episode changes for the same show before publishing.
  quietPeriod: 2m
  maxAttempts: 3
  # File types published with each completed media task. A target route can override this profile.
  includeTypes:
    - video
    - mediainfo
    - subtitle
    - nfo
    - thumb
    - tvshow-nfo
    - season-nfo
    - bif
    - poster
    - fanart
    - clearlogo
    - clearart
    - season-poster

renaming:
  concurrency: 3

scraping:
  enableTmdb: true
  enablePeople: true
  preferOriginalLanguagePoster: false
  imageSources:
    - tmdb
    - fanart
  fanartApiKey: ""
  fanartBaseUrl: https://webservice.fanart.tv
  tmdbApiKey: ""
  tmdbToken: ""
  tmdbBaseUrl: https://api.themoviedb.org
  tmdbImageBaseUrl: https://image.tmdb.org
  tmdbRequestTimeoutSeconds: 15
  language: zh-CN
  fallbackLanguages:
    - zh-TW
    - ja-JP
    - en-US
  region: CN
  proxy: ""

watchDirs: []
